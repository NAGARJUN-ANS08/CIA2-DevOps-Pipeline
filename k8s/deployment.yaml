apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management
  template:
    metadata:
      labels:
        app: student-management
    spec:
      containers:
        - name: student-management
          image: asia-south1-docker.pkg.dev/java-cicd-devops/java-app-repo/student-management:7
          ports:
            - containerPort: 8080
          imagePullPolicy: IfNotPresent